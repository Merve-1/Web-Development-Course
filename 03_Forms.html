<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <!--Form -->
    <h2>Form</h2>
    <form action="">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="User Name" required>
        <br>

        <input placeholder="test">
        <br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Email" required>
        <br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Password" required>
        <br>

        <label for="number">Number</label>
        <input type="number" name="number" id="number" placeholder="Number" required>
        <br>

        <label for="color">Color</label>
        <input type="color" name="color" id="color">
        <br>

        <label for="range">Range</label>
        <input type="range" name="range" id="range">
        <br>

        <label for="date">Date</label>
        <input type="date" name="date" id="date">
        <br>

        <label for="datetime-local">Datetime Local</label>
        <input type="datetime-local" name="datetime-local" id="datetime-local">
        <br>

        <label for="url">URL</label>
        <input type="url" name="url" id="url" placeholder="Enter URL">
        <br>

        <label for="search">Search</label>
        <input type="search" name="search" id="search" placeholder="Search...">
        <br>

        <input type="file" name="file1" id="file1">
        <label for="file1">All File</label>
        <br>

        <input type="file" name="file2" id="file2" accept=".pdf">
        <label for="file2">PDF File</label>
        <br>

        <input type="file" name="file3" id="file3" accept=".pdf, .docx">
        <label for="file3">PDF or Word File</label>
        <br>

        <input type="file" name="file4" id="file4" accept="image/*">
        <label for="file4">Any Image Type</label>
        <br>

        <input type="file" name="file5" id="file5" accept=".mp4">
        <label for="file5">Video</label>
        <br>
        
        <input type="file" name="file6" id="file6" multiple>
        <label for="file6">Multiple Files</label>
        <br>
        
        <input type="radio" name="radio" id="option1" value="1">
        <label for="option1">Option 1</label>
        <input type="radio" name="radio" id="option2" value="2">
        <label for="option2">Option 2</label>
        <br>

        <input type="checkbox" name="checkbox" id="check1" value="1">
        <label for="check1">Option 1</label>
        <input type="checkbox" name="checkbox" id="check2" value="2">
        <label for="check2">Option 2</label>
        <br>

        <label for="Gov">Gov</label>
        <select name="Gov" id="">
            <option value="Cairo">Cairo</option>
            <option value="Alex">Alex</option>
            <option value="Giza">Giza</option>
        </select>
        <br>

        <label for="country">Country</label>
        <select name="country" id="country">
            <optgroup label="Africa">
                <option value="Egypt">Egypt</option>
                <option value="Morocco">Morocco</option>
            </optgroup>
            <optgroup label="America">
                <option value="USA">USA</option>
                <option value="Brazil">Brazil</option>
            </optgroup>
            <optgroup label="Asia">
                <option value="China">China</option>
                <option value="India">India</option>
            </optgroup>
        </select>
        <br>

        <input type="text" list="Gov2" placeholder="Search by Name">
        <datalist id="Gov2">
            <option value="Cairo">Cairo</option>
            <option value="Giza">Giza</option>
            <option value="Alex">Alex</option>
        </datalist>
        <br>

        <!--Simple Validation-->
        <label for="test2">Max Length</label>
        <input type="text" name="test2" maxlength="20" id="test2">
        <br>
        <label for="test3">Min Length</label>
        <input type="text" name="test3" min="6" id="test3">
        <br>

        <label for="test4">Number min-max</label>
        <input type="number" name="test4" id="test4" min="15" max="30">

        <br>
        <input type="email" value="xx@gmail.com" disabled>
        <br>
        <input type="email" value="xx@gmail.com" readonly>
        <br>

        <label for="msg">This is a text area</label><br>
        <textarea name="msg" id="textarea" rows="8" cols="50"></textarea>

        <br>

        <label for="msg2">This is a text area2</label><br>
        <textarea name="msg2" id="textarea2" rows="8" cols="50" style="resize: none;"></textarea>
        <br>
        <input type="submit" disabled >
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

</body>
</html>
